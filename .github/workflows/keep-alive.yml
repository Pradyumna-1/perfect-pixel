name: Keep Render backend awake

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: |
          status=$(curl -sS -o /dev/null -w "%{http_code}" https://perfectpixel-tn21.onrender.com/api/health)
          echo "Health check status: $status"
          test "$status" = "200"
